name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
            label: macos-arm64
          - os: macos-13        # Intel (x86_64)
            label: macos-intel
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances + PyInstaller
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Vérifier que le cœur de l'outil fonctionne (sans GUI)
        shell: bash
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from snapfixer import core, matcher, zip_source
          print('import core/matcher/zip_source OK')
          "

      - name: Build (PyInstaller)
        run: pyinstaller snapfixer.spec --noconfirm

      # --- macOS : zippe le .app produit par le bloc BUNDLE du .spec ---
      - name: Empaqueter le .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Snapchat-Memories-Fixer.app" "Snapchat-Memories-Fixer-${{ matrix.label }}.zip"

      - name: Upload artefact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Memories-Fixer-${{ matrix.label }}
          path: dist/Snapchat-Memories-Fixer-${{ matrix.label }}.zip
          if-no-files-found: error

      # --- Windows : l'exécutable onefile est directement dist/Snapchat-Memories-Fixer.exe ---
      - name: Renommer l'exécutable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv "dist/Snapchat-Memories-Fixer.exe" "dist/Snapchat-Memories-Fixer-windows.exe"

      - name: Upload artefact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Memories-Fixer-windows
          path: dist/Snapchat-Memories-Fixer-windows.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aplatir les artefacts téléchargés
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp {} release/ \;
          ls -la release

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
